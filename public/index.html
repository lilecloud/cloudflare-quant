<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>A股多维度分析</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b12;--bg2:#0b1119;
  --card:#101722;--card2:#141d2b;
  --border:#1c2736;--border2:#2a3a50;
  --text:#e8eef7;--text2:#aebcd0;--dim:#6b7a90;
  --accent:#22d3ee;--accent2:#3b82f6;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 100%);
}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Helvetica,Arial,sans-serif;background:radial-gradient(1100px 400px at 50% -10%,rgba(34,211,238,.07),transparent 60%),var(--bg);color:var(--text);min-height:100vh;padding:22px 16px;-webkit-font-smoothing:antialiased}
.container{max-width:1000px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* 顶部标题栏 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-link{color:var(--accent);text-decoration:none;font-size:.85rem;padding:7px 15px;border:1px solid var(--border2);border-radius:9px;transition:all .18s;white-space:nowrap;background:rgba(34,211,238,.04)}
.nav-link:hover{border-color:var(--accent);background:rgba(34,211,238,.1)}

/* 标签页 */
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{padding:9px 20px;background:var(--card);border:1px solid var(--border);color:var(--dim);font-size:.9rem;cursor:pointer;border-radius:9px;transition:all .18s;font-weight:500}
.tab:hover{color:var(--text);border-color:var(--border2)}
.tab.active{background:var(--grad);color:#04121a;border-color:transparent;font-weight:700;box-shadow:0 4px 20px -6px rgba(34,211,238,.5)}
.tab-content{display:none}
.tab-content.active{display:block}

/* 搜索框 */
.search-box{display:flex;gap:10px;margin-bottom:24px}
.search-box input{flex:1;padding:13px 17px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);font-size:1rem;outline:none;transition:all .18s}
.search-box input::placeholder{color:var(--dim)}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.13);background:var(--card2)}
.search-box button{padding:13px 26px;border:none;border-radius:11px;background:var(--grad);color:#04121a;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .18s}
.search-box button:hover{filter:brightness(1.08)}
.search-box button:disabled{opacity:.45;cursor:not-allowed}

/* loading / error */
#loading{text-align:center;padding:52px 0;color:var(--dim);display:none}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;padding:14px 16px;border:1px solid rgba(239,68,68,.5);border-radius:11px;background:rgba(239,68,68,.08);color:#fca5a5;margin-bottom:16px;font-size:.9rem}

/* 个股头部 */
.stock-header{padding:18px 20px;margin-bottom:16px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--card2) 0%,var(--card) 100%);display:none}
.stock-header .name{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.stock-header .code{color:var(--accent);font-size:.9rem;margin-left:8px;font-variant-numeric:tabular-nums}
.stock-header .industry{color:var(--dim);font-size:.82rem;margin-top:5px}

/* 维度卡片：桌面双列 */
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:13px;align-items:start}
.dim{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);overflow:hidden;display:none}
.dim-header{padding:13px 17px;font-weight:600;font-size:.93rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;color:var(--text)}
.dim-header .icon{width:21px;height:21px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0}
.dim-header .icon.pass{background:rgba(34,197,94,.16);color:var(--green)}
.dim-header .icon.fail{background:rgba(239,68,68,.16);color:var(--red)}
.dim-header .icon.warn{background:rgba(234,179,8,.16);color:var(--yellow)}
.dim-body{padding:13px 17px;font-size:.86rem;line-height:1.65;color:var(--text2)}
.dim-body .error-msg{color:#fca5a5}
.dim-body .stat{color:var(--dim);margin-bottom:9px}
.dim-body .stat strong{color:var(--text);font-variant-numeric:tabular-nums}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:9px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--dim);font-weight:600;padding:6px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}
td{padding:6px;border-bottom:1px solid rgba(28,39,54,.7);white-space:nowrap;color:var(--text2)}
td:first-child,th:first-child{padding-left:0}
tr.target{color:var(--accent);font-weight:600}

/* 记录列表 */
.rec{display:flex;justify-content:space-between;padding:5px 0;font-size:.84rem;border-bottom:1px solid rgba(28,39,54,.5)}
.rec:last-child{border:none}
.rec .year{color:var(--dim)}
.rec .val{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.rec .mark{font-size:.9rem;margin-left:6px}
.rec .mark.pass{color:var(--green)}
.rec .mark.fail{color:var(--red)}

/* 结论条 */
.conclusion{margin-top:11px;padding:10px 13px;border-radius:10px;font-size:.86rem;font-weight:600}
.conclusion.pass{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.conclusion.fail{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.conclusion.warn{background:rgba(234,179,8,.1);color:#fde047;border:1px solid rgba(234,179,8,.25)}

/* 历史记录 */
.history{display:none;margin-bottom:20px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.history-title{font-size:.82rem;color:var(--dim);letter-spacing:.02em}
.history-clear{background:none;border:1px solid var(--border);border-radius:7px;color:var(--dim);font-size:.75rem;padding:4px 10px;cursor:pointer;transition:all .15s}
.history-clear:hover{color:#fca5a5;border-color:rgba(239,68,68,.5)}
.history-list{display:flex;flex-wrap:wrap;gap:7px}
.history-item{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;cursor:pointer;transition:all .15s;background:var(--card);white-space:nowrap}
.history-item:hover{border-color:var(--accent);background:var(--card2)}
.history-item .h-code{color:var(--accent);font-size:.78rem;font-variant-numeric:tabular-nums}
.history-item .h-name{color:var(--text)}

/* 指数卡片 */
#idxList,#idxNonPeList{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.index-card{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);padding:15px 17px;display:flex;flex-direction:column;transition:border-color .18s}
.index-card:hover{border-color:var(--border2)}
.index-card .i-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px}
.index-card .i-name{font-weight:700;font-size:.95rem}
.index-card .i-code{color:var(--dim);font-size:.78rem;font-variant-numeric:tabular-nums}
.index-card .i-stats{display:flex;gap:16px;font-size:.8rem;color:var(--dim);margin-bottom:12px}
.index-card .i-stats strong{color:var(--text);font-variant-numeric:tabular-nums}
.i-bar-wrap{position:relative;height:16px;margin-bottom:8px;margin-top:4px}
.i-bar-bg{position:absolute;inset:0;background:linear-gradient(to right,#22c55e 0%,#22c55e 10%,#4ade80 10%,#4ade80 30%,#eab308 30%,#eab308 70%,#f97316 70%,#f97316 90%,#ef4444 90%,#ef4444 100%);border-radius:6px;opacity:.22}
.i-bar{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.i-bar-marker{width:4px;height:16px;background:var(--text);border-radius:2px;position:absolute;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.5)}
.i-bar-val{font-size:.72rem;font-weight:700;color:var(--text);position:absolute;top:-18px;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.i-footer{display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.i-level{font-weight:700}
.i-level.est{color:#22c55e}
.i-level.under{color:#4ade80}
.i-level.normal{color:#eab308}
.i-level.over{color:#f97316}
.i-level.hot{color:#ef4444}
.i-level.na{color:#6b7a90}
.i-action{color:var(--dim);font-size:.78rem}
.idx-section-title{font-size:.85rem;font-weight:700;color:var(--accent);margin:20px 0 11px;padding-left:10px;border-left:3px solid var(--accent);letter-spacing:.02em}
.i-val-badge{font-size:.7rem;color:var(--dim);border:1px solid var(--border);border-radius:10px;padding:2px 9px;background:rgba(34,211,238,.05)}
.i-note{font-size:.76rem;color:var(--dim);margin-bottom:12px;line-height:1.5}

@media(max-width:720px){
  body{padding:14px 12px}
  #results{grid-template-columns:1fr}
}
@media(max-width:480px){
  .search-box{flex-direction:column}
  .search-box button{padding:13px}
  .stock-header .name{font-size:1.15rem}
  #idxList,#idxNonPeList{grid-template-columns:1fr}
  .tab{padding:8px 14px;font-size:.84rem}
  h1{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📊 A股 多维度分析</h1>
    <a class="nav-link" href="/monitor">📡 信号监控</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="stock">个股分析</button>
    <button class="tab" data-tab="index">指数估值</button>
  </div>

  <!-- Tab 1: 个股分析 -->
  <div class="tab-content active" id="tabStock">
  <div class="search-box">
    <input type="text" id="codeInput" placeholder="输入股票代码，如 600000" maxlength="6" inputmode="numeric" pattern="\d*">
    <button id="searchBtn">分析</button>
  </div>

  <div class="history" id="history">
    <div class="history-header">
      <span class="history-title">历史记录</span>
      <button class="history-clear" id="clearHistory">清空</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <span>正在获取数据，请稍候...</span>
  </div>

  <div id="error"></div>

  <div class="stock-header" id="stockHeader">
    <div>
      <span class="name" id="stockName"></span>
      <span class="code" id="stockCode"></span>
    </div>
    <div class="industry" id="stockIndustry"></div>
  </div>

  <div id="results">
    <div class="dim" id="dimPe"><div class="dim-header"><span class="icon" id="peIcon">?</span>行业市盈率排名</div><div class="dim-body" id="peBody"></div></div>
    <div class="dim" id="dimRoe"><div class="dim-header"><span class="icon" id="roeIcon">?</span>ROE连续5年分析</div><div class="dim-body" id="roeBody"></div></div>
    <div class="dim" id="dimEps"><div class="dim-header"><span class="icon" id="epsIcon">?</span>每股收益连续5年增长</div><div class="dim-body" id="epsBody"></div></div>
    <div class="dim" id="dimDebt"><div class="dim-header"><span class="icon" id="debtIcon">?</span>负债率预警</div><div class="dim-body" id="debtBody"></div></div>
    <div class="dim" id="dimCf"><div class="dim-header"><span class="icon" id="cfIcon">?</span>经营现金流分析</div><div class="dim-body" id="cfBody"></div></div>
    <div class="dim" id="dimRevenue"><div class="dim-header"><span class="icon" id="revenueIcon">?</span>营收增长分析（A）</div><div class="dim-body" id="revenueBody"></div></div>
    <div class="dim" id="dimMargin"><div class="dim-header"><span class="icon" id="marginIcon">?</span>毛利率/净利率（A）</div><div class="dim-body" id="marginBody"></div></div>
    <div class="dim" id="dimFcf"><div class="dim-header"><span class="icon" id="fcfIcon">?</span>自由现金流分析（A）</div><div class="dim-body" id="fcfBody"></div></div>
    <div class="dim" id="dimValuation"><div class="dim-header"><span class="icon" id="valuationIcon">?</span>历史估值百分位（A）</div><div class="dim-body" id="valuationBody"></div></div>
    <div class="dim" id="dimCashRatio"><div class="dim-header"><span class="icon" id="cashRatioIcon">?</span>净现比分析（B）</div><div class="dim-body" id="cashRatioBody"></div></div>
    <div class="dim" id="dimGoodwill"><div class="dim-header"><span class="icon" id="goodwillIcon">?</span>商誉占比（B）</div><div class="dim-body" id="goodwillBody"></div></div>
    <div class="dim" id="dimLiquidity"><div class="dim-header"><span class="icon" id="liquidityIcon">?</span>流动/速动比率（B）</div><div class="dim-body" id="liquidityBody"></div></div>
    <div class="dim" id="dimPeg"><div class="dim-header"><span class="icon" id="pegIcon">?</span>PEG估值（B）</div><div class="dim-body" id="pegBody"></div></div>
  </div>
  </div>

  <!-- Tab 2: 指数估值 -->
  <div class="tab-content" id="tabIndex">
  <div id="idxLoading" style="text-align:center;padding:40px 0;color:var(--dim);display:none">
    <div class="spinner"></div>
    <span>正在获取指数数据，请稍候...</span>
  </div>
  <div id="idxError" style="display:none;padding:16px;border:1px solid rgba(239,68,68,.5);border-radius:11px;background:rgba(239,68,68,.08);color:#fca5a5;margin-bottom:16px;font-size:.9rem"></div>
  <div id="idxUpdated" style="text-align:right;color:var(--dim);font-size:.75rem;margin-bottom:8px"></div>
  <div class="idx-section-title" id="idxPeTitle" style="display:none">📊 市盈率估值</div>
  <div id="idxList"></div>
  <div class="idx-section-title" id="idxNonPeTitle" style="display:none">📌 非市盈率估值</div>
  <div id="idxNonPeList"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
