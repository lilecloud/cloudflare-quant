<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>信号监控</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--accent:#58a6ff;--overlay:rgba(0,0,0,.65)}
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .container{max-width:980px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:1.4rem;font-weight:600;white-space:nowrap}
  .back{color:var(--accent);text-decoration:none;font-size:.88rem;padding:6px 14px;border:1px solid var(--border);border-radius:8px;transition:border-color .15s;white-space:nowrap}
  .back:hover{border-color:var(--accent)}
  .sub{color:var(--dim);font-size:.85rem;margin-bottom:16px}

  .tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border)}
  .tab{padding:9px 16px;background:none;border:none;color:var(--dim);font-size:.92rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--text)}
  .panel{display:none}
  .panel.active{display:block}

  .card{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:16px;margin-bottom:16px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .card-title{font-weight:600}
  .muted{color:var(--dim);font-size:.82rem}

  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:500;background:rgba(139,148,158,.06);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  code{background:rgba(139,148,158,.12);padding:2px 6px;border-radius:4px;font-size:.78rem;word-break:break-all}

  .btn{padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;font-size:.8rem;transition:border-color .15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover{border-color:var(--accent);opacity:.9}

  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600;white-space:nowrap}
  .b-BUY{background:rgba(63,185,80,.15);color:var(--green)}
  .b-SELL{background:rgba(248,81,73,.15);color:var(--red)}
  .b-HOLD{background:rgba(139,148,158,.12);color:var(--dim)}
  .b-ERROR{background:rgba(210,153,34,.15);color:var(--yellow)}
  .arrow{color:var(--dim)}

  .info-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;border-radius:50%;background:var(--yellow);color:#111;border:none;font-size:.72rem;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;line-height:1;padding:0;flex-shrink:0}
  .info-btn:hover{opacity:.85;transform:scale(1.1)}

  label{display:block;font-size:.82rem;margin-bottom:4px;color:var(--dim)}
  input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:.95rem;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1 / -1}
  .form-actions{margin-top:14px;display:flex;gap:8px}

  /* 规则说明弹窗 */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .modal-overlay[hidden]{display:none}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
  .modal-title{font-weight:600;font-size:1rem}
  .modal-cat{color:var(--dim);font-size:.74rem;margin-top:3px}
  .modal-close{background:none;border:none;color:var(--dim);font-size:1.25rem;cursor:pointer;padding:0 4px;line-height:1}
  .modal-close:hover{color:var(--text)}
  .modal-body{padding:16px 18px;font-size:.88rem;line-height:1.7;overflow-y:auto}
  .doc-section{margin-bottom:14px}
  .doc-label{color:var(--accent);font-size:.76rem;margin-bottom:4px;font-weight:600}
  .doc-value{color:var(--text)}
  .doc-formula{background:rgba(139,148,158,.1);padding:9px 11px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;word-break:break-all;color:#9ae6b4}

  /* 手机端适配 */
  @media (max-width: 640px) {
    body{padding:12px}
    .topbar h1{font-size:1.15rem}
    .card{padding:12px}
    .toolbar{margin-bottom:12px}
    .toolbar > button{width:100%}

    /* 表格 → 卡片 */
    .mtable thead{display:none}
    .mtable, .mtable tbody, .mtable tr, .mtable td{display:block;width:100%}
    .mtable tr{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:10px 12px;background:var(--card)}
    .mtable tr:last-child{margin-bottom:0}
    .mtable td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
    .mtable td::before{content:attr(data-label);color:var(--dim);font-size:.78rem;flex-shrink:0;text-align:left}
    .mtable td.name-cell{font-weight:600;justify-content:flex-start;text-align:left}
    .mtable td.name-cell::before{display:none}
    .mtable td.actions-cell{justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:4px;padding-top:10px;border-top:1px solid var(--border)}
    .mtable td.actions-cell::before{display:none}

    .form-grid{grid-template-columns:1fr}
    .form-actions .btn{flex:1}
    .modal{max-height:88vh}
    .modal-body{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📡 信号监控</h1>
    <a class="back" href="/">← 返回分析页</a>
  </div>
  <div class="sub">规则保存在 Cloudflare KV，本地脚本定时计算并写回信号</div>

  <div class="tabs">
    <button class="tab active" data-tab="rules">监控规则</button>
    <button class="tab" data-tab="status">运行状态</button>
  </div>

  <!-- 规则管理 -->
  <div class="panel active" id="panel-rules">
    <div class="card">
      <div class="toolbar">
        <div>
          <div class="card-title">监控规则</div>
          <div class="muted">点规则名后的 ❗ 可看指标详解</div>
        </div>
        <button id="btn-add" class="btn btn-primary">＋ 新增规则</button>
      </div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr>
            <th>名称</th><th>指标</th><th>方向</th><th>BUY</th><th>SELL</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="rules-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="rule-form" hidden>
      <div class="card-title" id="form-title" style="margin-bottom:12px">新增规则</div>
      <div class="form-grid">
        <div><label>规则 ID（唯一，英文）</label><input type="text" id="f-id" placeholder="如 erp_csi300"></div>
        <div><label>名称</label><input type="text" id="f-name" placeholder="如 沪深300股权风险溢价"></div>
        <div class="full"><label>指标 indicator</label>
          <input type="text" id="f-indicator" list="indicator-options" placeholder="如 erp_csi300">
          <datalist id="indicator-options">
            <option value="erp_csi300">沪深300股权风险溢价</option>
            <option value="dividend_yield_H30269">红利低波股息率</option>
            <option value="dividend_yield_000922">中证红利股息率</option>
            <option value="dividend_yield_000905">中证500股息率</option>
            <option value="pe_percentile_000300">沪深300 PE百分位</option>
            <option value="pe_percentile_000905">中证500 PE百分位</option>
            <option value="pe_percentile_000922">中证红利 PE百分位</option>
            <option value="pe_percentile_H30269">红利低波 PE百分位</option>
          </datalist>
        </div>
        <div><label>方向</label>
          <select id="f-direction">
            <option value="high">值越高越买（股息率/股债利差）</option>
            <option value="low">值越低越买（PE 百分位）</option>
          </select>
        </div>
        <div><label>启用</label>
          <select id="f-enabled">
            <option value="true">启用</option>
            <option value="false">停用</option>
          </select>
        </div>
        <div><label>BUY 阈值</label><input type="number" id="f-buy" step="0.1"></div>
        <div><label>SELL 阈值</label><input type="number" id="f-sell" step="0.1"></div>
      </div>
      <div class="form-actions">
        <button id="btn-save" class="btn btn-primary">保存</button>
        <button id="btn-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 运行状态 -->
  <div class="panel" id="panel-status">
    <div class="card">
      <div class="toolbar">
        <div>
          <div class="card-title">最新运行结果</div>
          <div class="muted" id="last-run">尚未运行</div>
        </div>
        <button id="btn-refresh" class="btn">刷新</button>
      </div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr><th>规则</th><th>当前值</th><th>信号</th><th>说明</th><th>更新时间</th></tr></thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">信号变化历史</div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr><th>时间</th><th>规则</th><th>变化</th><th>值</th></tr></thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 规则说明弹窗 -->
<div class="modal-overlay" id="docOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="docTitle"></div>
        <div class="modal-cat" id="docCat"></div>
      </div>
      <button class="modal-close" id="docClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="docBody"></div>
  </div>
</div>

<script src="/monitor.js"></script>
</body>
</html>
