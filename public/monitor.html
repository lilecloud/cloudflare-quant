<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>信号监控</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#070b12;--card:#101722;--card2:#141d2b;
    --border:#1c2736;--border2:#2a3a50;
    --text:#e8eef7;--text2:#aebcd0;--dim:#6b7a90;
    --accent:#22d3ee;--accent2:#3b82f6;
    --green:#22c55e;--red:#ef4444;--yellow:#eab308;
    --grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 100%);
    --overlay:rgba(2,5,10,.7);
  }
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Helvetica,Arial,sans-serif;background:radial-gradient(1000px 380px at 50% -10%,rgba(34,211,238,.06),transparent 60%),var(--bg);color:var(--text);min-height:100vh;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .container{max-width:1000px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .back{color:var(--accent);text-decoration:none;font-size:.85rem;padding:7px 15px;border:1px solid var(--border2);border-radius:9px;transition:all .18s;white-space:nowrap;background:rgba(34,211,238,.04)}
  .back:hover{border-color:var(--accent);background:rgba(34,211,238,.1)}
  .sub{color:var(--dim);font-size:.83rem;margin-bottom:18px}

  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tab{padding:9px 20px;background:var(--card);border:1px solid var(--border);color:var(--dim);font-size:.9rem;cursor:pointer;border-radius:9px;transition:all .18s;font-weight:500}
  .tab.active{background:var(--grad);color:#04121a;border-color:transparent;font-weight:700;box-shadow:0 4px 20px -6px rgba(34,211,238,.5)}
  .tab:hover{color:var(--text);border-color:var(--border2)}
  .panel{display:none}
  .panel.active{display:block}

  .card{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);padding:16px;margin-bottom:16px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card-title{font-weight:700;font-size:.98rem}
  .muted{color:var(--dim);font-size:.82rem}

  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:600;background:rgba(34,211,238,.03);white-space:nowrap;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}
  tr:last-child td{border-bottom:none}
  td{color:var(--text2)}
  code{background:rgba(34,211,238,.08);color:var(--accent);padding:2px 7px;border-radius:5px;font-size:.76rem;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .btn{padding:7px 13px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .15s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);background:var(--card2)}
  .btn-primary{background:var(--grad);color:#04121a;border-color:transparent;font-weight:700}
  .btn-primary:hover{filter:brightness(1.08)}

  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.75rem;font-weight:700;white-space:nowrap}
  .b-BUY{background:rgba(34,197,94,.15);color:#4ade80}
  .b-SELL{background:rgba(239,68,68,.15);color:#fca5a5}
  .b-HOLD{background:rgba(107,122,144,.15);color:var(--dim)}
  .b-ERROR{background:rgba(234,179,8,.15);color:#fde047}
  .arrow{color:var(--dim)}

  .info-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;min-width:18px;border-radius:50%;background:var(--yellow);color:#0a0e14;border:none;font-size:.72rem;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;line-height:1;padding:0;flex-shrink:0}
  .info-btn:hover{opacity:.85;transform:scale(1.1)}

  label{display:block;font-size:.82rem;margin-bottom:5px;color:var(--dim)}
  input[type=text],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.92rem;outline:none;transition:border-color .15s}
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .form-grid .full{grid-column:1 / -1}
  .form-actions{margin-top:16px;display:flex;gap:9px}

  /* 规则说明弹窗 */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .modal-overlay[hidden]{display:none}
  .modal{background:linear-gradient(180deg,var(--card2) 0%,var(--card) 100%);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
  .modal-title{font-weight:700;font-size:1.02rem}
  .modal-cat{color:var(--dim);font-size:.74rem;margin-top:4px}
  .modal-close{background:none;border:none;color:var(--dim);font-size:1.25rem;cursor:pointer;padding:0 5px;line-height:1}
  .modal-close:hover{color:var(--text)}
  .modal-body{padding:18px 20px;font-size:.88rem;line-height:1.7;overflow-y:auto;color:var(--text2)}
  .doc-section{margin-bottom:15px}
  .doc-label{color:var(--accent);font-size:.76rem;margin-bottom:5px;font-weight:700;letter-spacing:.02em}
  .doc-value{color:var(--text2)}
  .doc-formula{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);padding:10px 12px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;word-break:break-all;color:#67e8f9}

  /* 手机端适配 */
  @media (max-width: 640px) {
    body{padding:12px}
    .topbar h1{font-size:1.15rem}
    .card{padding:13px}
    .toolbar{margin-bottom:12px}
    .toolbar > button{width:100%}

    .mtable thead{display:none}
    .mtable, .mtable tbody, .mtable tr, .mtable td{display:block;width:100%}
    .mtable tr{border:1px solid var(--border);border-radius:11px;margin-bottom:10px;padding:10px 12px;background:var(--card)}
    .mtable tr:last-child{margin-bottom:0}
    .mtable td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
    .mtable td::before{content:attr(data-label);color:var(--dim);font-size:.78rem;flex-shrink:0;text-align:left}
    .mtable td.name-cell{font-weight:600;justify-content:flex-start;text-align:left;color:var(--text)}
    .mtable td.name-cell::before{display:none}
    .mtable td.actions-cell{justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:4px;padding-top:10px;border-top:1px solid var(--border)}
    .mtable td.actions-cell::before{display:none}

    .form-grid{grid-template-columns:1fr}
    .form-actions .btn{flex:1}
    .modal{max-height:88vh}
    .modal-body{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📡 信号监控</h1>
    <a class="back" href="/">← 返回分析页</a>
  </div>
  <div class="sub">规则保存在 Cloudflare KV，本地脚本定时计算并写回信号</div>

  <div class="tabs">
    <button class="tab active" data-tab="rules">监控规则</button>
    <button class="tab" data-tab="status">运行状态</button>
  </div>

  <!-- 规则管理 -->
  <div class="panel active" id="panel-rules">
    <div class="card">
      <div class="toolbar">
        <div>
          <div class="card-title">监控规则</div>
          <div class="muted">点规则名后的 ❗ 可看指标详解</div>
        </div>
        <button id="btn-add" class="btn btn-primary">＋ 新增规则</button>
      </div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr>
            <th>名称</th><th>指标</th><th>方向</th><th>BUY</th><th>SELL</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="rules-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="rule-form" hidden>
      <div class="card-title" id="form-title" style="margin-bottom:12px">新增规则</div>
      <div class="form-grid">
        <div><label>规则 ID（唯一，英文）</label><input type="text" id="f-id" placeholder="如 erp_csi300"></div>
        <div><label>名称</label><input type="text" id="f-name" placeholder="如 沪深300股权风险溢价"></div>
        <div class="full"><label>指标 indicator</label>
          <input type="text" id="f-indicator" list="indicator-options" placeholder="如 erp_csi300">
          <datalist id="indicator-options">
            <option value="erp_csi300">沪深300股权风险溢价</option>
            <option value="dividend_yield_H30269">红利低波股息率</option>
            <option value="dividend_yield_000922">中证红利股息率</option>
            <option value="dividend_yield_000905">中证500股息率</option>
            <option value="pe_percentile_000300">沪深300 PE百分位</option>
            <option value="pe_percentile_000905">中证500 PE百分位</option>
            <option value="pe_percentile_000922">中证红利 PE百分位</option>
            <option value="pe_percentile_H30269">红利低波 PE百分位</option>
          </datalist>
        </div>
        <div><label>方向</label>
          <select id="f-direction">
            <option value="high">值越高越买（股息率/股债利差）</option>
            <option value="low">值越低越买（PE 百分位）</option>
          </select>
        </div>
        <div><label>启用</label>
          <select id="f-enabled">
            <option value="true">启用</option>
            <option value="false">停用</option>
          </select>
        </div>
        <div><label>BUY 阈值</label><input type="number" id="f-buy" step="0.1"></div>
        <div><label>SELL 阈值</label><input type="number" id="f-sell" step="0.1"></div>
      </div>
      <div class="form-actions">
        <button id="btn-save" class="btn btn-primary">保存</button>
        <button id="btn-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 运行状态 -->
  <div class="panel" id="panel-status">
    <div class="card">
      <div class="toolbar">
        <div>
          <div class="card-title">最新运行结果</div>
          <div class="muted" id="last-run">尚未运行</div>
        </div>
        <button id="btn-refresh" class="btn">刷新</button>
      </div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr><th>规则</th><th>当前值</th><th>信号</th><th>说明</th><th>更新时间</th></tr></thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">信号变化历史</div>
      <div class="table-wrap">
        <table class="mtable">
          <thead><tr><th>时间</th><th>规则</th><th>变化</th><th>值</th></tr></thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 规则说明弹窗 -->
<div class="modal-overlay" id="docOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="docTitle"></div>
        <div class="modal-cat" id="docCat"></div>
      </div>
      <button class="modal-close" id="docClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="docBody"></div>
  </div>
</div>

<script src="/monitor.js"></script>
</body>
</html>
